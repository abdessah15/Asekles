<html lang="fr">
<head>

<style>
:root {
  --primary: #ff0066;
  --primary-hover: #ff3385;
  --secondary: #6600ff;
  --bg-color: #0a0a0f;
  --surface-color: rgba(20, 20, 25, 0.85);
  --surface-border: rgba(255, 255, 255, 0.1);
  --text-main: #f8f9fa;
  --text-muted: #a0a0a0;
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  margin: 0;
  background-color: var(--bg-color);
  color: var(--text-main);
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
}

/* 🌫️ Image de fond floutée */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("fond.png") center / cover no-repeat;
  filter: blur(12px);
  transform: scale(1.1);
  z-index: -1;
}

/* ===== HEADER & SEARCH BAR ===== */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 900;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 5%;
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--surface-border);
}

.top-bar h1 {
  margin: 0;
  font-size: 1.5em;
  font-weight: 800;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.search-bar {
  display: flex;
  align-items: center;
  background: var(--surface-color);
  border: 1px solid var(--surface-border);
  border-radius: 25px;
  padding: 8px 15px;
  margin: 0 20px;
  flex-grow: 1;
  max-width: 400px;
  transition: all 0.3s ease;
}

.search-bar:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 15px rgba(255, 0, 102, 0.2);
}

.search-bar input {
  background: transparent;
  border: none;
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.95em;
  width: 100%;
  outline: none;
  margin: 0;
  padding: 0;
}

.search-bar input::placeholder {
  color: var(--text-muted);
}

.search-bar button {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin-left: 10px;
  width: auto;
  transition: color 0.3s;
}

.search-bar button:hover {
  color: var(--primary);
  transform: none;
}

nav {
  display: flex;
  gap: 20px;
  align-items: center;
}

#messengerTopBtn {
  background: #0084FF;
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 0.9em;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 15px rgba(0, 132, 255, 0.3);
}

#messengerTopBtn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 132, 255, 0.5);
}

/* ===== CONTENT & GRID ===== */
.content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px 100px;
}

.content h2 {
  font-size: 1.8em;
  margin-bottom: 30px;
  font-weight: 800;
  background: linear-gradient(90deg, #fff, var(--text-muted));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 25px;
}

.movie-item {
  background: var(--surface-color);
  backdrop-filter: blur(10px);
  border: 1px solid var(--surface-border);
  padding: 12px;
  border-radius: 16px;
  text-align: center;
  position: relative;
  transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
}

.movie-item:hover {
  transform: translateY(-6px);
  box-shadow: 0 15px 30px rgba(255, 0, 102, 0.25);
  border-color: rgba(255, 0, 102, 0.4);
}

.movie-item img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  border-radius: 12px;
  display: block;
  box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}

.movie-item h3 {
  margin-top: 15px;
  margin-bottom: 5px;
  font-size: 1.05em;
  font-weight: 700;
  color: var(--text-main);
}

/* Badge VIP */
.badge-vip {
  position: absolute;
  top: 20px;
  right: 20px;
  background: linear-gradient(90deg, #ffcc00, #ff9900);
  color: #000;
  padding: 4px 10px;
  font-size: 0.7em;
  font-weight: 800;
  border-radius: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
  z-index: 10;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

a {
  text-decoration: none;
  color: inherit;
}

/* ===== MODAL DE CONNEXION ===== */
#loginModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 10000;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal-content {
  background: rgba(20, 20, 25, 0.95);
  border: 1px solid var(--surface-border);
  padding: 30px 25px;
  border-radius: 20px;
  width: 100%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  position: relative;
}

.close-btn {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 1.5em;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.3s;
}

.close-btn:hover {
  color: var(--primary);
}

.modal-content h3 {
  margin: 0 0 20px;
  color: var(--text-main);
  font-weight: 800;
  font-size: 1.4em;
}

.modal-content input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid var(--surface-border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  font-size: 16px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.modal-content input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 10px rgba(255, 0, 102, 0.3);
}

.modal-content input::placeholder {
  color: var(--text-muted);
}

.password-container {
  position: relative;
  width: 100%;
}

.password-container input {
  margin-bottom: 0;
  padding-right: 45px;
}

#togglePassword {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  margin: 0;
  width: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: color 0.3s;
}

#togglePassword:hover {
  color: var(--text-main);
}

#togglePassword svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.eye-open { display: block; }
.eye-closed { display: none; }
.password-container.show-pwd .eye-open { display: none; }
.password-container.show-pwd .eye-closed { display: block; }

.modal-content button#modalLoginBtn {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  color: white;
  box-shadow: 0 4px 15px rgba(255, 0, 102, 0.3);
  transition: transform 0.2s, box-shadow 0.2s;
}

.modal-content button#modalLoginBtn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 0, 102, 0.5);
}

#error {
  color: #ff5555;
  margin-top: 15px;
  font-size: 14px;
  font-weight: 600;
}

/* ===== FOOTER ===== */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--surface-border);
  text-align: center;
  padding: 12px;
  font-size: .85em;
  color: var(--text-muted);
  z-index: 800;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  .top-bar {
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    padding: 15px;
  }
  .top-bar h1 {
    order: 1;
    width: 100%;
    text-align: center;
  }
  .search-bar {
    order: 2;
    width: 100%;
    max-width: 100%;
    margin: 0;
  }
  nav {
    order: 3;
    width: 100%;
    justify-content: center;
  }
  .movie-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
  }
  .content {
    padding: 20px 15px 100px;
  }
}
</style>
</head>

<body>

<!-- 🔥 FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAX7amyQdzfssmwjIaaFl1qn0Ts5af1DCM",
  authDomain: "test-2fdd3.firebaseapp.com",
  databaseURL: "https://test-2fdd3-default-rtdb.firebaseio.com",
  projectId: "test-2fdd3",
  appId: "1:244317844373:web:3a4e5b77c649f54d7fbc9c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

var loginModal = document.getElementById("loginModal");
var closeModal = document.getElementById("closeModal");
var modalLoginBtn = document.getElementById("modalLoginBtn");
var errorEl = document.getElementById("error");

var pendingMovieUrl = null;

// 👁️ Affichage mot de passe
const passwordInput = document.getElementById("password");
const togglePasswordBtn = document.getElementById("togglePassword");
const pwdContainer = document.getElementById("pwdContainer");

togglePasswordBtn.onclick = () => {
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    pwdContainer.classList.add("show-pwd");
  } else {
    passwordInput.type = "password";
    pwdContainer.classList.remove("show-pwd");
  }
};

// 📩 Messenger
const messengerBtn = document.getElementById("messengerTopBtn");
messengerBtn.onclick = () => {
  const msg = "Azul 👋";
  const userAgent = navigator.userAgent || navigator.vendor || window.opera;
  if (/android|iphone|ipad|ipod/i.test(userAgent)) {
    window.location.href = "fb-messenger://user-thread/kherzi.abdessah.7";
    setTimeout(() => {
      window.open("https://m.me/kherzi.abdessah.7?text=" + encodeURIComponent(msg), "_blank");
    }, 500);
  } else {
    window.open("https://m.me/kherzi.abdessah.7?text=" + encodeURIComponent(msg), "_blank");
  }
};

// Interception des clics sur les films
document.querySelectorAll('.movie-link').forEach(function(link) {
  link.addEventListener('click', function(e) {
    const accessType = this.getAttribute('data-access');
    
    if (accessType === 'vip') {
      e.preventDefault();
      pendingMovieUrl = this.href;
      loginModal.style.display = "flex";
    }
    // Si c'est 'free', le lien s'ouvre normalement vers la page du film.
  });
});

closeModal.onclick = function() {
  loginModal.style.display = "none";
  pendingMovieUrl = null;
}

// Connexion et vérification VIP dans la base de données
async function handleLogin() {
  const emailVal = document.getElementById("email").value;
  const passwordVal = document.getElementById("password").value;

  if(!emailVal || !passwordVal) {
    errorEl.innerText = "Ssekcem isem n umiḍan d tsarut.";
    return;
  }

  try {
    const userCredential = await signInWithEmailAndPassword(auth, emailVal, passwordVal);
    const user = userCredential.user;

    // Vérifier si le compte est VIP dans Firebase Database
    const snapshot = await get(ref(db, "users/" + user.uid));
    if (snapshot.exists()) {
      const data = snapshot.val();
      const today = new Date().toISOString().split("T")[0];

      if (data.expiresAt < today) {
        errorEl.innerText = "Amiḍan yekfa (Compte expiré).";
        auth.signOut();
        return;
      }

      if (data.isVIP === true) {
        // Redirection vers le film VIP demandé
        window.location.href = pendingMovieUrl || "index.html";
      } else {
        errorEl.innerText = "Amiḍan-a mačči d VIP.";
      }
    } else {
      errorEl.innerText = "Yir talɣut n umiḍan.";
    }
  } catch (err) {
    errorEl.innerText = "Tuccḍa deg tsarut neɣ deg umiḍan !";
  }
}

modalLoginBtn.onclick = handleLogin;

document.getElementById("email").addEventListener("keypress", (e) => {
  if (e.key === "Enter") handleLogin();
});
document.getElementById("password").addEventListener("keypress", (e) => {
  if (e.key === "Enter") handleLogin();
});

// Recherche dynamique
document.getElementById('searchInput').addEventListener('input', function(e) {
  const searchTerm = e.target.value.toLowerCase();
  const movies = document.querySelectorAll('.movie-item');

  movies.forEach(movie => {
    const title = movie.querySelector('h3').textContent.toLowerCase();
    if (title.includes(searchTerm)) {
      movie.style.display = 'block';
    } else {
      movie.style.display = 'none';
    }
  });
});
</script>
