<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<!-- 📱 Mobile friendly (empêche le zoom auto) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Anekcum – Asekles</title>

<!-- Nouvelle police moderne -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #ff0066;
  --primary-hover: #ff3385;
  --secondary: #6600ff;
  --bg-color: #0a0a0f;
  --surface-color: rgba(20, 20, 25, 0.85);
  --surface-border: rgba(255, 255, 255, 0.1);
  --text-main: #f8f9fa;
  --text-muted: #a0a0a0;
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 15px;
  overflow: hidden;
  position: relative;
  background-color: var(--bg-color);
  color: var(--text-main);
}

/* 🌫️ Image de fond floutée */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("fond.png") center / cover no-repeat;
  filter: blur(12px);
  transform: scale(1.1);
  z-index: -1;
}

.box {
  background: var(--surface-color);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--surface-border);
  padding: 30px 25px;
  border-radius: 20px;
  width: 100%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
}

h2 {
  margin: 0 0 20px;
  color: var(--text-main);
  font-weight: 800;
  font-size: 1.5em;
  letter-spacing: 0.5px;
}

/* 🔵 Inputs (no zoom mobile) */
input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid var(--surface-border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  font-size: 16px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: border-color 0.3s, box-shadow 0.3s;
}

input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 10px rgba(255, 0, 102, 0.3);
}

input::placeholder {
  color: var(--text-muted);
}

/* Conteneur pour le mot de passe et l'icône SVG */
.password-container {
  position: relative;
  width: 100%;
}

.password-container input {
  margin-bottom: 0;
  padding-right: 45px;
}

#togglePassword {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  margin: 0;
  width: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: color 0.3s;
}

#togglePassword:hover {
  color: var(--text-main);
}

#togglePassword svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* Gestion de l'affichage des icônes SVG */
.eye-open { display: block; }
.eye-closed { display: none; }

.password-container.show-pwd .eye-open { display: none; }
.password-container.show-pwd .eye-closed { display: block; }

/* 🔘 Buttons */
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-2px);
}

/* Messenger */
#messengerBtn {
  background: #0084FF;
  color: white;
  box-shadow: 0 4px 15px rgba(0, 132, 255, 0.3);
}

#messengerBtn:hover {
  box-shadow: 0 6px 20px rgba(0, 132, 255, 0.5);
}

/* Login */
#loginBtn {
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  color: white;
  box-shadow: 0 4px 15px rgba(255, 0, 102, 0.3);
}

#loginBtn:hover {
  box-shadow: 0 6px 20px rgba(255, 0, 102, 0.5);
}

#error {
  color: #ff5555;
  margin-top: 15px;
  font-size: 14px;
  font-weight: 600;
}
</style>
</head>

<body>

<div class="box">
  <h2>Kcem s tsarut</h2>

  <!-- 🔵 Messenger -->
  <button id="messengerBtn">Aɣ-d tasarut</button>

  <hr style="margin:20px 0; border:none; border-top:1px solid var(--surface-border);">

  <!-- 🔐 Login Form -->
  <input id="email" type="email" placeholder="Isem n umiḍan">
  
  <div class="password-container" id="pwdContainer">
    <input id="password" type="password" placeholder="Tasarut">
    <button type="button" id="togglePassword" title="Ẓer tasarut">
      <!-- Icône SVG œil ouvert -->
      <svg class="eye-open" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      <!-- Icône SVG œil barré (masqué) -->
      <svg class="eye-closed" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2.81 2.81L1.39 4.22l3.65 3.65C3.4 9.03 2.15 10.42 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l4.42 4.42 1.41-1.41L2.81 2.81zM12 15c-1.66 0-3-1.34-3-3 0-.35.07-.69.18-1l3.82 3.82c-.31.11-.65.18-1 .18z"/></svg>
    </button>
  </div>

  <button id="loginBtn">Kcem</button>

  <p id="error"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js";

/* 🔥 Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyAX7amyQdzfssmwjIaaFl1qn0Ts5af1DCM",
  authDomain: "test-2fdd3.firebaseapp.com",
  databaseURL: "https://test-2fdd3-default-rtdb.firebaseio.com",
  projectId: "test-2fdd3",
  appId: "1:244317844373:web:3a4e5b77c649f54d7fbc9c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* 👁️ Bascule affichage mot de passe avec SVG */
const passwordInput = document.getElementById("password");
const togglePasswordBtn = document.getElementById("togglePassword");
const pwdContainer = document.getElementById("pwdContainer");

togglePasswordBtn.onclick = () => {
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    pwdContainer.classList.add("show-pwd");
  } else {
    passwordInput.type = "password";
    pwdContainer.classList.remove("show-pwd");
  }
};

/* 📩 Messenger (Compatible mobile et bureau) */
const messengerBtn = document.getElementById("messengerBtn");
messengerBtn.onclick = () => {
  const msg = "Azul 👋";
  const userAgent = navigator.userAgent || navigator.vendor || window.opera;
  
  // Détection mobile pour basculer sur l'application Messenger si possible
  if (/android|iphone|ipad|ipod/i.test(userAgent)) {
    window.location.href = "fb-messenger://user-thread/kherzi.abdessah.7";
    // Fallback web si l'app n'est pas installée
    setTimeout(() => {
      window.open("https://m.me/kherzi.abdessah.7?text=" + encodeURIComponent(msg), "_blank");
    }, 500);
  } else {
    window.open("https://m.me/kherzi.abdessah.7?text=" + encodeURIComponent(msg), "_blank");
  }
};

/* 🔑 Fonction de connexion partagée */
async function handleLogin() {
  const errorEl = document.getElementById("error");
  const emailVal = document.getElementById("email").value;
  const passwordVal = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, emailVal, passwordVal);
    window.location.href = "index.html";
  } catch (err) {
    errorEl.innerText = "Tuccḍa deg tsarut neɣ deg umiḍan !";
  }
}

/* Clic sur le bouton de connexion */
document.getElementById("loginBtn").onclick = handleLogin;

/* ⌨️ Raccourci clavier "Entrée" sur les champs de saisie */
document.getElementById("email").addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    handleLogin();
  }
});

document.getElementById("password").addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    handleLogin();
  }
});
</script>

</body>
</html>
