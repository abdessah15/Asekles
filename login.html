<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<!-- 📱 Mobile friendly (empêche le zoom auto) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Anekcum – Asekles</title>

<!-- Nouvelle police moderne -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #ff0066;
  --primary-hover: #ff3385;
  --secondary: #6600ff;
  --bg-color: #0a0a0f;
  --surface-color: rgba(20, 20, 25, 0.85);
  --surface-border: rgba(255, 255, 255, 0.1);
  --text-main: #f8f9fa;
  --text-muted: #a0a0a0;
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 15px;
  overflow: hidden;
  position: relative;
  background-color: var(--bg-color);
  color: var(--text-main);
}

/* 🌫️ Image de fond floutée */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("fond.png") center / cover no-repeat;
  filter: blur(12px);
  transform: scale(1.1);
  z-index: -1;
}

.box {
  background: var(--surface-color);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--surface-border);
  padding: 30px 25px;
  border-radius: 20px;
  width: 100%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
}

h2 {
  margin: 0 0 20px;
  color: var(--text-main);
  font-weight: 800;
  font-size: 1.5em;
  letter-spacing: 0.5px;
}

/* 🔵 Inputs (no zoom mobile) */
input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid var(--surface-border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  font-size: 16px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: border-color 0.3s, box-shadow 0.3s;
}

input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 10px rgba(255, 0, 102, 0.3);
}

input::placeholder {
  color: var(--text-muted);
}

/* Conteneur pour le mot de passe et l'œil */
.password-container {
  position: relative;
  width: 100%;
}

.password-container input {
  margin-bottom: 0;
  padding-right: 45px;
}

#togglePassword {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
  padding: 0;
  margin: 0;
  width: auto;
  color: var(--text-muted);
  transition: color 0.3s;
}

#togglePassword:hover {
  color: var(--text-main);
  transform: translateY(-50%);
  box-shadow: none;
}

/* 🔘 Buttons */
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
  transform: translateY(-2px);
}

/* Messenger */
#messengerBtn {
  background: #0084FF;
  color: white;
  box-shadow: 0 4px 15px rgba(0, 132, 255, 0.3);
}

#messengerBtn:hover {
  box-shadow: 0 6px 20px rgba(0, 132, 255, 0.5);
}

/* Login */
#loginBtn {
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  color: white;
  box-shadow: 0 4px 15px rgba(255, 0, 102, 0.3);
}

#loginBtn:hover {
  box-shadow: 0 6px 20px rgba(255, 0, 102, 0.5);
}

#error {
  color: #ff5555;
  margin-top: 15px;
  font-size: 14px;
  font-weight: 600;
}
</style>
</head>

<body>

<div class="box">
  <h2>Kcem s tsarut</h2>

  <!-- 🔵 Messenger -->
  <button id="messengerBtn">Aɣ-d aferwak</button>

  <hr style="margin:20px 0; border:none; border-top:1px solid var(--surface-border);">

  <!-- 🔐 Login Form -->
  <input id="email" type="email" placeholder="Isem n umiḍan">
  
  <div class="password-container">
    <input id="password" type="password" placeholder="Tasarut">
    <button type="button" id="togglePassword" title="Ẓer tasarut">👁️</button>
  </div>

  <button id="loginBtn">Kcem</button>

  <p id="error"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

/* 🔥 Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyAX7amyQdzfssmwjIaaFl1qn0Ts5af1DCM",
  authDomain: "test-2fdd3.firebaseapp.com",
  projectId: "test-2fdd3",
  appId: "1:244317844373:web:3a4e5b77c649f54d7fbc9c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* 👁️ Voir / Cacher le mot de passe */
const passwordInput = document.getElementById("password");
const togglePasswordBtn = document.getElementById("togglePassword");

togglePasswordBtn.onclick = () => {
  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    togglePasswordBtn.textContent = "🙈";
  } else {
    passwordInput.type = "password";
    togglePasswordBtn.textContent = "👁️";
  }
};

/* 📩 Messenger */
messengerBtn.onclick = () => {
  const msg = `Azul 👋`;

  window.open(
    "https://m.me/kherzi.abdessah.7?text=" + encodeURIComponent(msg),
    "_blank"
  );
};

/* 🔑 Fonction de connexion partagée */
async function handleLogin() {
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);
    window.location.href = "index.html";
  } catch {
    error.innerText = "Tuccḍa deg tsarut !";
  }
}

/* Clic sur le bouton de connexion */
loginBtn.onclick = handleLogin;

/* ⌨️ Raccourci clavier "Entrée" sur les champs de saisie */
email.addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    handleLogin();
  }
});

password.addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    handleLogin();
  }
});
</script>

</body>
</html>
